<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#1a1a3e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>职业盲盒</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
:root {
  --deep: #1a1a3e; --blue: #16213e; --midnight: #0f0f2d;
  --gold: #ffb74d; --coral: #ff8a80; --mint: #69f0ae; --sky: #64b5f6; --lavender: #ce93d8;
  --grad: linear-gradient(135deg, #ffb74d, #ff8a80);
  --ease: cubic-bezier(0.25,0.1,0.25,1.0);
  --bounce: cubic-bezier(0.34,1.56,0.64,1);
  --safe-b: env(safe-area-inset-bottom, 16px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body,#root{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Noto Sans SC',system-ui,sans-serif;background:var(--midnight);color:#fff;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(100,181,246,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 60%,rgba(206,147,216,0.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(255,183,77,0.05) 0%,transparent 40%),linear-gradient(180deg,#1a1a3e 0%,#16213e 40%,#0f0f2d 100%)}
.glass{background:rgba(20,18,50,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.08);position:relative}
.btn1{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 32px;min-height:48px;min-width:48px;border:none;border-radius:16px;background:var(--grad);color:#fff;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(255,183,77,0.3);transition:transform .15s var(--bounce),box-shadow .15s var(--ease)}
.btn1:active{transform:scale(0.95);box-shadow:0 2px 8px rgba(255,183,77,0.2)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;min-height:44px;min-width:44px;border:1.5px solid rgba(255,255,255,0.2);border-radius:16px;background:rgba(255,255,255,0.08);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:all .15s var(--ease)}
.btn2:active{background:rgba(255,255,255,0.15);transform:scale(0.97)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.12);font-size:14px;font-weight:500;color:rgba(255,255,255,0.85)}
.progress-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden;width:200px}
.progress-fill{height:100%;border-radius:3px;background:var(--grad);transition:width .2s}
.step-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all .3s var(--ease)}
.step-dot.on{background:var(--gold);box-shadow:0 0 8px rgba(255,183,77,0.5);transform:scale(1.2)}
.step-dot.ok{background:var(--mint)}
.fade-in{animation:fadeIn .4s var(--ease)}
.fade-up{animation:fadeUp .4s var(--ease)}
.bounce-in{animation:bounceIn .5s var(--bounce)}
.shake{animation:shake .3s ease-in-out}
.float{animation:float 3s ease-in-out infinite}
.twinkle{animation:twinkle var(--d,2s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.05)}70%{transform:scale(0.9)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(180deg)}}
@keyframes pop{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
.page{width:100%;height:100%;position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:20px 20px calc(20px + var(--safe-b)) 20px}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;animation:twinkle var(--d,2s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.flip-card{perspective:1000px;width:200px;height:280px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .8s var(--ease);transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.flip-front{transform:rotateY(180deg)}
.choice-btn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);cursor:pointer;text-align:left;color:#fff;font-size:15px;font-weight:500;line-height:1.5;width:100%;transition:all .2s}
.choice-btn:active{transform:scale(0.97)}
.choice-btn.sel-ok{border-color:rgba(105,240,174,0.4);background:rgba(105,240,174,0.08)}
.choice-btn.sel-err{border-color:rgba(255,138,128,0.4);background:rgba(255,138,128,0.08)}
.circle-countdown{width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,183,77,0.6);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--gold);margin-bottom:4px;box-shadow:0 0 12px rgba(255,183,77,0.3);transition:all .3s}
.circle-countdown.urgent{border-color:#ff8a80;color:#ff8a80;box-shadow:0 0 20px rgba(255,138,128,0.5);animation:urgentPulse .5s infinite}
@keyframes urgentPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.checkbox{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checkbox.off{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2)}
.checkbox.on{background:var(--mint)}
.card-3d{width:100%;max-width:300px;height:250px;perspective:800px;cursor:pointer}
.card-3d.unflipped{animation:cardPulse 2s ease-in-out infinite}
@keyframes cardPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.card-3d-inner{position:relative;width:100%;height:100%;transition:transform .6s var(--ease);transform-style:preserve-3d}
.card-3d-inner.flipped{transform:rotateY(180deg)}
.card-3d-front,.card-3d-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px}
.card-3d-front{transform:rotateY(180deg)}
.dc-btn{transition:all .2s var(--ease)}
.dc-btn:active{transform:scale(0.96)!important}
@keyframes boxGlow{0%,100%{box-shadow:0 0 20px rgba(255,183,77,0.3),0 0 60px rgba(255,183,77,0.1)}50%{box-shadow:0 0 35px rgba(255,183,77,0.5),0 0 90px rgba(255,138,128,0.2)}}
@keyframes boxShake{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg) scale(1.03)}20%{transform:rotate(8deg) scale(1.03)}30%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}50%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}70%{transform:rotate(0)}}
@keyframes boxOpen{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2) rotate(-15deg);opacity:0.8}100%{transform:scale(0) rotate(30deg);opacity:0}}
@keyframes heroReveal{0%{transform:scale(0) translateY(40px);opacity:0}60%{transform:scale(1.2) translateY(-10px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes burstOut{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1);opacity:0}}
.mystery-box{cursor:pointer;width:180px;height:180px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;transition:transform .2s var(--bounce);animation:boxGlow 2s ease-in-out infinite}
.mystery-box:active{transform:scale(0.95)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/javascript">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
// 决策树骨架 — 统一结构，各职业只提供场景内容
// ============================================================
const TREE_SKELETON = [
  { id:'1',  aNext:'2A',bNext:'2B', aScore:12,bScore:4 },
  { id:'2A', aNext:'3B',bNext:'3A', aScore:4, bScore:12 },
  { id:'2B', aNext:'3A',bNext:'3B', aScore:10,bScore:5 },
  { id:'3A', aNext:'4B',bNext:'4A', aScore:5, bScore:15 },
  { id:'3B', aNext:'4A',bNext:'4B', aScore:12,bScore:4 },
  { id:'4A', aNext:'5B',bNext:'5A', aScore:4, bScore:13 },
  { id:'4B', aNext:'5A',bNext:'5B', aScore:13,bScore:0 },
  { id:'5A', aNext:'6A',bNext:'6B', aScore:14,bScore:5 },
  { id:'5B', aNext:'6A',bNext:'6B', aScore:12,bScore:6 },
  { id:'6A', aNext:'7', bNext:'7',  aScore:12,bScore:3 },
  { id:'6B', aNext:'7', bNext:'7',  aScore:2, bScore:10 },
  { id:'7',  aNext:'8', bNext:'8',  aScore:12,bScore:5 },
  { id:'8',  aNext:null,bNext:null,aScore:10,bScore:3 },
];
const MAX_SCORE = 100;
const PASS_SCORE = 80;

function buildDecisionTree(scenes, careerName) {
  const isArray = Array.isArray(scenes);
  const lastScene = isArray ? scenes[scenes.length-1] : scenes['5A'];
  const fb = lastScene || { bg:'linear-gradient(180deg, #1a1a3e 0%, #16213e 40%, #0f0f2d 100%)', accent:'#ffb74d' };
  // Per-node fallback templates — career-aware placeholders
  const fallbacks = [
    null, null, null, null, null, null, null, null, // 1..5A use real data
    { sceneName:'⚡ 紧急抉择', title:'两难的考验',
      dialogText:`作为一名${careerName}，你面临一个两难的局面——两个选择各有利弊，但必须做出决定。你选择——`,
      aEmoji:'🤔', aLabel:'选择稳妥方案', aDesc:'安全第一，不走险棋', aFeedback:'稳妥的选择让你避免了风险，也赢得了信任。但有时候，过于保守可能错失良机。',
      bEmoji:'🔥', bLabel:'选择大胆尝试', bDesc:'有风险但收获可能更大', bFeedback:'勇敢的尝试！虽然过程有些波折，但你展现的勇气和创新精神得到了认可。' },
    { sceneName:'🌟 关键时刻', title:'压力下的判断',
      dialogText:`时间紧迫，你必须在压力下做出一个影响后续走向的判断。作为${careerName}，你的选择至关重要——`,
      aEmoji:'⏰', aLabel:'快速决策', aDesc:'时间不等人，凭直觉行动', aFeedback:'在时间压力下你的快速反应展现了专业素养。关键决策不一定要完美——但一定要及时。',
      bEmoji:'🧘', bLabel:'冷静分析后再定', bDesc:'花几分钟评估所有可能', bFeedback:'你顶住了时间压力先做了分析，决策质量更高。有时候慢就是快——想清楚再出手。' },
    { sceneName:'💡 意外转机', title:'隐藏的机会',
      dialogText:`一个意想不到的情况出现了——它可能是个麻烦，也可能是个机会。作为${careerName}，你看到了什么？`,
      aEmoji:'⚠️', aLabel:'视作风险处理', aDesc:'按标准流程规避风险', aFeedback:'你按规程处理了风险。谨慎是最可靠的策略——尤其是在不熟悉的情况下。',
      bEmoji:'🎯', bLabel:'视作机会抓住', bDesc:'风险背后藏着意想不到的收获', bFeedback:'你敏锐地发现了风险背后的机遇，用创新的方式化险为夷。优秀的专业人才总能在别人看到麻烦的地方看到可能。' },
    { sceneName:'🎯 最后关卡', title:'终极挑战',
      dialogText:`接近尾声了——最后一个大关卡。你回顾了一路走来的经验，准备迎接${careerName}道路上最关键的一次考验——`,
      aEmoji:'💪', aLabel:'全力以赴', aDesc:'把所有的经验和勇气都用上', aFeedback:'你把一路学到的都用上了。全力以赴的态度本身就是最好的答案——结果证明了这一点。',
      bEmoji:'🧠', bLabel:'智取巧胜', bDesc:'用策略和智慧找最佳路径', bFeedback:'你巧妙地运用了之前的经验，找到了最高效的解决方案。智慧不只是知道答案——更是知道怎么找到答案。' },
    { sceneName:'🏁 终点线', title:'最后的决定',
      dialogText:`作为${careerName}的旅程即将结束——最后一个决定，它将为这次体验画上句号。你会选择——`,
      aEmoji:'🌟', aLabel:'完美谢幕', aDesc:'追求最好的结局', aFeedback:'精彩的收尾！你为这次体验画上了完美的句号。记住这一路学到的东西——它们会在未来派上用场。',
      bEmoji:'🌱', bLabel:'种下未来的种子', bDesc:'不追求完美，但留下成长的空间', bFeedback:'你选择了一个开放式的结尾——为未来留下了更多可能。有时候最好的结局不是"到此结束"而是"未完待续"。' },
  ];

  const nodes = {};
  TREE_SKELETON.forEach((sk, i) => {
    const s = isArray ? scenes[i] : scenes[sk.id];
    const scene = s || fallbacks[i] || { sceneName:'⚠️', title:'待补充', dialogText:'场景数据待补充...',
      aEmoji:'⏭️', aLabel:'跳过', aDesc:'', aFeedback:'',
      bEmoji:'⏭️', bLabel:'跳过', bDesc:'', bFeedback:'' };
    nodes[sk.id] = {
      id: sk.id, sceneName: scene.sceneName, title: scene.title,
      bg: scene.bg || fb.bg, accent: scene.accent || fb.accent,
      dialogText: scene.dialogText,
      choiceA: { emoji:scene.aEmoji, label:scene.aLabel, desc:scene.aDesc||'', score:sk.aScore, next:sk.aNext, feedback:scene.aFeedback||'' },
      choiceB: { emoji:scene.bEmoji, label:scene.bLabel, desc:scene.bDesc||'', score:sk.bScore, next:sk.bNext, feedback:scene.bFeedback||'' },
    };
  });
  return nodes;
}

// ============================================================
// 15 个职业完整数据
// ============================================================
const careers = {

astronaut: {
  id:'astronaut', name:'航天员', emoji:'👨‍🚀', tagline:'飞向星辰大海，探索宇宙边疆',
  field:'航天航空', funFact:'在太空中，航天员的身高会因为脊椎伸展而增加3-5厘米！但回到地球又会缩回去🌍',
  intro:'航天员是乘坐宇宙飞船进入太空探索的人。他们在离地面约400公里的空间站里工作，做科学实验、维修设备、探索宇宙的奥秘——是人类勇敢的"太空探险家"。',
  timeline:[
    {era:'古代',emoji:'🏹',text:'古人仰望星空，梦想飞到月亮上去。600多年前，万户尝试用火箭飞天，是最早的航天追梦人。'},
    {era:'现在',emoji:'🚀',text:'人类已登上月球、建造了空间站。中国航天员住进了自己的"太空家园"——天宫空间站。'},
    {era:'未来',emoji:'🔭',text:'也许你长大后会登上火星、在月球建基地——下一个太空英雄可能就是你！'},
  ],
  abilities:[
    {name:'强壮的身体',emoji:'💪',subject:'体育',def:'承受火箭发射时相当于4个人压在身上的超重压力，每天跑步、游泳、旋转训练。'},
    {name:'聪明的头脑',emoji:'🧠',subject:'数学·物理·生物',def:'数学算轨道、物理理解失重、生物了解人体在太空的变化。'},
    {name:'冷静的心态',emoji:'🧘',subject:'心理素质',def:'太空中遇紧急情况不能慌，要在几秒内做出正确判断。'},
    {name:'灵巧的双手',emoji:'🔧',subject:'工程·计算机',def:'会修各种机器，穿着厚厚的太空服也能拧紧一颗小螺丝。'},
  ],
  workScenes:[
    {time:'🌅 早起',title:'锻炼身体',desc:'跑步、力量训练，保持强壮',emoji:'🏃'},
    {time:'🕐 上午',title:'模拟训练',desc:'在模拟飞船里练习各种操作',emoji:'🕹️'},
    {time:'📚 下午',title:'学习知识',desc:'学物理、数学、英语、俄语...',emoji:'📖'},
    {time:'🚀 发射',title:'飞向太空',desc:'穿航天服，坐飞船去空间站！',emoji:'🔥'},
  ],
  figures:[
    {name:'杨利伟',title:'中国进入太空第一人',emoji:'🇨🇳',story:'2003年，杨利伟乘坐神舟五号飞上太空，绕地球飞了14圈。他是全中国的骄傲！'},
    {name:'王亚平',title:'太空教师',emoji:'👩‍🚀',story:'王亚平在空间站里给全国小朋友上了一堂"太空课"——在失重环境下表演了会飘的水球，太神奇了！'},
  ],
  scenes: [
    { sceneName:'🚀 火箭发射台', title:'发射倒计时', bg:'linear-gradient(180deg, #1a0808 0%, #3d1515 35%, #16213e 100%)', accent:'#ff6b6b',
      dialogText:'发射前30分钟，你正在检查系统。突然，头盔显示器弹出黄色警告——燃料传感器读数出现轻微波动。地面指挥中心还没注意到...',
      aEmoji:'📢', aLabel:'立即报告指挥中心', aDesc:'安全第一，让地面团队排查', aFeedback:'正确！在航天领域，"有疑问就报告"是铁律。指挥中心检查后发现阀门密封圈有微小老化——如果强行发射，高温燃气可能泄漏。',
      bEmoji:'🤫', bLabel:'忽略警告继续发射', bDesc:'黄色只是警告不是故障', bFeedback:'冒险的选择。发射阶段任何异常都不该放过——后来的数据表明那个阀门确实有问题。别担心，太空中还会有更多选择！' },
    { sceneName:'🫁 轨道舱', title:'氧气泄漏预警', bg:'linear-gradient(180deg, #0a1628 0%, #0d2847 40%, #16213e 100%)', accent:'#64b5f6',
      dialogText:'进入轨道后，舱内氧气浓度正缓慢下降。如果不处理，8小时后就会达到危险水平。你判断——',
      aEmoji:'🤔', aLabel:'先观察一小时', aDesc:'下降很慢，可能是传感器误差', aFeedback:'等待有时是策略，但氧气问题不能等。一小时后浓度又降了0.3%，排查时间更少了。太空中的"等等看"往往意味着"等危机来"。',
      bEmoji:'🔍', bLabel:'启动泄漏定位程序', bDesc:'逐舱排查，找到泄漏源并封堵', bFeedback:'严谨！你带队逐舱排查，在实验舱管道接口处发现了微小泄漏。修补后氧气恢复正常。在太空中，永远不要对异常"等等看"——小问题会变成大麻烦。' },

  const [animIn,setAnimIn] = useState(true);

  const node = decisionNodes[nodeId];
  const currentStep = history.length + 1;
  const totalScore = history.reduce((s,h)=>s+h.score,0);

  useEffect(()=>{setAnimIn(true);const t=setTimeout(()=>setAnimIn(false),400);return ()=>clearTimeout(t)},[nodeId]);

  const choose = (key) => {
    const ch = key==='A' ? node.choiceA : node.choiceB;
    setLastPick({key,emoji:ch.emoji,label:ch.label,score:ch.score,feedback:ch.feedback,next:ch.next});
    setHistory(h=>[...h,{nodeId,choice:key,score:ch.score,nodeTitle:node.title,nodeScene:node.sceneName}]);
    setPhase('feedback');
  };

  const nextScene = () => {
    if (history.length >= TOTAL) {
      const finalScore = history.reduce((s,h)=>s+h.score,0);
      onDone({history, totalScore:finalScore, passed:finalScore>=PASS_SCORE});
    } else {
      setNodeId(lastPick.next);
      setLastPick(null);
      setPhase('playing');
    }
  };

  const skip = () => {
    const dummyHistory = [];
    let nid = '1';

      dummyHistory.push({nodeId:nid,choice:'skip',score:0,nodeTitle:dn.title,nodeScene:dn.sceneName});

            React.createElement('p', {style:{fontSize:13,color:'rgba(255,255,255,0.35)',textAlign:'center',marginBottom:12}}, '翻开卡片，看看你今天发现了什么'),
            React.createElement('div', {style:{display:'flex',justifyContent:'center'}},
              React.createElement('div', {className:`card-3d${isF?'':' unflipped'}`, onClick:flip},
                React.createElement('div', {className:`card-3d-inner ${isF?'flipped':''}`},
                  React.createElement('div', {className:'card-3d-back glass', style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,overflow:'hidden'}},
                    React.createElement('div', {style:{position:'absolute',top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,${titleColor},#ff8a80,#ce93d8)`}}),
                    React.createElement('span', {style:{fontSize:48}}, '🎴'),
                    React.createElement('p', {style:{fontSize:16,fontWeight:600}}, isF ? '继续发现...' : '今天我发现了...'),
                    React.createElement('p', {style:{fontSize:13,color:'rgba(255,255,255,0.4)'}}, `第 ${di+1} 个秘密`),
                    !isF && React.createElement('div', {style:{marginTop:4,display:'flex',alignItems:'center',gap:6,padding:'6px 16px',borderRadius:20,background:'rgba(255,255,255,0.06)',border:'1px dashed rgba(255,255,255,0.15)'}},
                      React.createElement('span', {style:{fontSize:18}}, '👆'),
                      React.createElement('span', {style:{fontSize:13,color:'rgba(255,255,255,0.5)',fontWeight:500}}, '点击翻转卡片')
                    )
                  ),
                  React.createElement('div', {className:'card-3d-front glass', style:{display:'flex',flexDirection:'column',justifyContent:'center',padding:24,overflow:'auto'}},
                    React.createElement('div', {style:{textAlign:'center',marginBottom:12}}, React.createElement('span', {style:{fontSize:40}}, disc.emoji)),
                    React.createElement('p', {style:{fontSize:15,fontWeight:600,marginBottom:8,textAlign:'center'}}, disc.title),
                    React.createElement('p', {style:{fontSize:13,color:'rgba(255,255,255,0.75)',lineHeight:1.7,textAlign:'center'}}, disc.desc)
                  )
                )
              )
            ),
            isF && di<discoveries.length-1 && React.createElement('div', {style:{textAlign:'center',marginTop:12}},
              React.createElement('button', {className:'btn2 fade-up', onClick:nextDisc, style:{borderColor:'rgba(255,255,255,0.2)',padding:'10px 24px'}},
                '👉 翻开下一张发现卡'
              )
            )
          )
        : React.createElement('div', {className:'glass', style:{textAlign:'center',padding:40,margin:'0 20px'}},
            React.createElement('div', {style:{fontSize:48,marginBottom:12}}, '🌱'),
            React.createElement('p', {style:{fontSize:16,fontWeight:600,marginBottom:8,color:'rgba(255,255,255,0.7)'}}, '通关后解锁发现卡'),
            React.createElement('p', {style:{fontSize:13,color:'rgba(255,255,255,0.45)',lineHeight:1.6}}, `达到 ${PASS_SCORE} 分即可解锁${career.name}知识发现卡！`, React.createElement('br'), '再试一次，你一定可以的 💪')
          )
      ),
      tab==='review' && React.createElement('div', {style:{padding:'0 16px'}},
        history.map((h,i)=>{
          const node = decisionNodes[h.nodeId];
          const isBest = h.score >= 10;
          return React.createElement('div', {key:i, className:'fade-up', style:{
            display:'flex',gap:10,alignItems:'flex-start',padding:14,marginBottom:10,
            borderRadius:16,background:isBest?'rgba(105,240,174,0.04)':'rgba(255,138,128,0.04)',
            border:`1px solid ${isBest?'rgba(105,240,174,0.12)':'rgba(255,138,128,0.12)'}`,
            animationDelay:i*0.05+'s'
          }},
            React.createElement('div', {style:{width:32,height:32,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,flexShrink:0,marginTop:2,background:isBest?'rgba(105,240,174,0.15)':'rgba(255,138,128,0.15)',color:isBest?'#69f0ae':'#ff8a80'}}, i+1),
            React.createElement('div', {style:{flex:1}},
              React.createElement('p', {style:{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:2}}, h.nodeScene),
              React.createElement('p', {style:{fontSize:14,fontWeight:600,marginBottom:2}}, h.nodeTitle),
              React.createElement('p', {style:{fontSize:12,color:'rgba(255,255,255,0.55)'}}, `选择：${h.choice==='A'?node.choiceA.label:node.choiceB.label}`)
            ),
            React.createElement('span', {style:{fontSize:16,fontWeight:700,color:isBest?'#69f0ae':'#ff8a80',flexShrink:0}}, `+${h.score}`)
          );
        })
      ),
      React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:12,padding:'0 20px',marginTop:tab==='cards'&&allDone?20:8}},
        passed && React.createElement(React.Fragment, null,
          React.createElement('button', {className:'btn1', onClick:onResources}, '🏛️ 去哪能体验当${career.name}？→'),
          React.createElement('button', {className:'btn2', onClick:onRestart}, '🔄 返回大厅')
        ),
        !passed && React.createElement(React.Fragment, null,
          React.createElement('button', {className:'btn1', onClick:onRetry, style:{background:'linear-gradient(135deg, #ff8a80, #ffb74d)'}}, '🔄 再来一次！'),
          React.createElement('button', {className:'btn1', onClick:onResources, style:{background:'linear-gradient(135deg, #64b5f6, #42a5f5)'}}, `📍 看看${career.name}都在什么地方工作 →`),
          React.createElement('button', {className:'btn2', onClick:onRestart}, '🏠 返回大厅')
        ),
        passed && allDone && tab==='cards' && React.createElement('button', {className:'btn2', onClick:onRetry, style:{marginTop:4}}, '🔄 再挑战一次（试试不同选择）')
      )
    ),
    di===0 && !isF && tab==='cards' && discCount>0 && React.createElement(Mascot, {msg:'点一下卡片，看看你发现了什么秘密！', pos:'br'})
  );
}

// ============================================================
// 阶段6: Resources
// ============================================================
function ResourcesPanel({onRestart, career}) {
  const r = career.resources;
  return React.createElement('div', {className:'page bg'},
    React.createElement(StarryBg, null),
    React.createElement('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',paddingTop:'max(16px,var(--safe-t))'}},
      React.createElement('button', {className:'btn2', style:{padding:'8px 16px',fontSize:14}, onClick:onRestart}, '← 返回'),
      React.createElement('span', {style:{fontSize:14,color:'rgba(255,255,255,0.5)'}}, '推荐资源'),
      React.createElement('div', {style:{width:60}})
    ),
    React.createElement('div', {className:'scroll', style:{paddingBottom:100}},
      React.createElement('div', {style:{textAlign:'center',marginBottom:24}},
        React.createElement('h1', {style:{fontSize:24,fontWeight:700,marginBottom:4}}, `继续探索${career.name}`),
        React.createElement('p', {style:{fontSize:14,color:'rgba(255,255,255,0.5)'}}, '把这些转发给爸妈，让他们帮你安排！')
      ),
      React.createElement(ResSection, {title:'体验参观', items:r.visits}),
      React.createElement(ResSection, {title:'实践机会', items:r.practices}),
      React.createElement(ResSection, {title:'科普书单', items:r.books})
    ),
    React.createElement('div', {style:{position:'fixed',bottom:0,left:0,right:0,zIndex:50,padding:'12px 20px calc(12px + var(--safe-b))',background:'linear-gradient(180deg, transparent 0%, rgba(15,15,45,0.92) 30%, rgba(15,15,45,1) 100%)',display:'flex',gap:10}},
      React.createElement('button', {className:'btn1', style:{flex:1,fontSize:16}, onClick:()=>{
        const text = [
          '【体验参观】',
          ...r.visits.map(v=>`  • ${v.name}${v.location?' | 📍'+v.location:''}\n    ${v.desc||''}${v.url?'\n    🔗 '+v.url:''}`),
          '',
          '【实践机会】',
          ...r.practices.map(p=>`  • ${p.name}${p.location?' | 📍'+p.location:''}\n    ${p.desc||''}${p.url?'\n    🔗 '+p.url:''}`),
          '',
          '【科普书单】',
          ...r.books.map(b=>`  • ${b.name}\n    ${b.desc||''}`)
        ].join('\n');
        if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('已复制！发给爸爸妈妈看看吧 📤'))}
        else{alert('已复制！发给爸爸妈妈看看吧 📤')}
      }}, '一键复制资源清单'),
      React.createElement('button', {className:'btn2', style:{padding:'12px 16px',fontSize:14}, onClick:onRestart}, '返回大厅')
    )
  );
}

function ResSection({title,items}) {
  if (!items || items.length===0) return null;
  return React.createElement('div', {style:{marginBottom:20,padding:'0 4px'}},
    React.createElement('h2', {style:{fontSize:17,fontWeight:700,marginBottom:12}}, title),
    React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:10}},
      items.map((it,i)=>React.createElement('div', {key:i, className:'glass fade-up', style:{padding:16,display:'flex',gap:12,alignItems:'flex-start'}},
        React.createElement('div', {style:{flex:1}},
          React.createElement('p', {style:{fontSize:15,fontWeight:600,marginBottom:4}}, it.name),
          React.createElement('p', {style:{fontSize:13,color:'rgba(255,255,255,0.65)',lineHeight:1.5}}, it.desc||it.description),
          React.createElement('div', {style:{display:'flex',gap:8,marginTop:6,flexWrap:'wrap',alignItems:'center'}},
            it.location && React.createElement('span', {style:{fontSize:11,color:'rgba(100,181,246,0.7)'}}, `📍 ${it.location}`),
            it.url && React.createElement('a', {href:it.url, target:'_blank', rel:'noopener', style:{fontSize:11,color:'rgba(105,240,174,0.8)',textDecoration:'none',marginLeft:'auto'}}, '🔗 去看看 →')
          )
        )
      ))
    )
  );
}

// ============================================================
// 主应用
// ============================================================
function App() {
  const [phase,setPhase] = useState('loading');
  const [career,setCareer] = useState(null);
  const [decisionNodes,setDecisionNodes] = useState(null);
  const [gameResult,setGameResult] = useState(null);

  useEffect(()=>{
    const f=()=>{document.documentElement.style.setProperty('--vh',window.innerHeight*0.01+'px')};
    f(); window.addEventListener('resize',f); return ()=>window.removeEventListener('resize',f);
  },[]);

  const selectCareer = useCallback(() => {
    const c = getRandomCareer();
    setCareer(c);
    setDecisionNodes(getCareerDecisionNodes(c));
    setGameResult(null);
  }, []);

  const goIntro = useCallback(() => { setPhase('intro'); }, []);

  const reroll = useCallback(() => { setGameResult(null); setPhase('hall'); }, []);

  const reset = useCallback(() => { setGameResult(null); setPhase('hall'); }, []);

  const startGame = useCallback(() => { setGameResult(null); setPhase('experience'); }, []);
  const retry = useCallback(() => { setGameResult(null); setPhase('experience'); }, []);

  const onGameDone = useCallback((r) => { setGameResult(r); setPhase('result'); }, []);

  switch(phase) {
    case 'loading': return React.createElement(LoadingScreen, {onDone: ()=>setPhase('hall')});
    case 'hall': return React.createElement(MysteryBoxEntry, {onFlip: goIntro, onSelect: selectCareer, career: career||careers.astronaut});
    case 'intro': return React.createElement(CareerIntro, {onStart: startGame, career, onReroll: reroll});
    case 'experience': return React.createElement(DecisionPlayer, {onDone: onGameDone, decisionNodes});
    case 'result': return React.createElement(ResultPanel, {result: gameResult, onResources: ()=>setPhase('resources'), onRestart: reset, onRetry: retry, career, decisionNodes});
    case 'resources': return React.createElement(ResourcesPanel, {onRestart: reset, career});
    default: return React.createElement(LoadingScreen, {onDone: ()=>setPhase('hall')});
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
